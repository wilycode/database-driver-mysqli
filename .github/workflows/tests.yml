name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: PHP 8.4 / MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: wilycode_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: '3306'
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASS: test-password
      MYSQL_TEST_DB: wilycode_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: composer:v2
          coverage: none

      - name: Validate Composer package
        run: composer validate --strict

      - name: Verify MySQLi extension
        run: |
          php -r "exit(extension_loaded('mysqli') ? 0 : 1);"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: composer test
