name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: PHP 8.4 / MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: wilycode_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: '3306'
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASS: test-password
      MYSQL_TEST_DB: wilycode_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: composer:v2
          coverage: none

      - name: Validate Composer package
        run: composer validate --strict

      - name: Verify MySQLi extension
        run: |
          php -r "exit(extension_loaded('mysqli') ? 0 : 1);"

      # Pin coordinated, unreleased dependencies; remove after their releases.
      - name: Check out database dialect changes
        uses: actions/checkout@v4
        with:
          repository: wilycode/database
          ref: cacdacc2ee7591ed8bbbffb5e42fc82474ac8a65
          path: .ci-deps/database

      # Pin coordinated, unreleased dependencies; remove after their releases.
      - name: Check out database-query dialect changes
        uses: actions/checkout@v4
        with:
          repository: wilycode/database-query
          ref: 786e7e2976e155604ded739174fc8e3dc6779c5a
          path: .ci-deps/database-query

      - name: Use coordinated dependency versions for this draft
        run: |
          composer config repositories.dialect-database '{"type":"path","url":".ci-deps/database","options":{"versions":{"wilycode/database":"0.1.2"}}}'
          composer config repositories.dialect-database-query '{"type":"path","url":".ci-deps/database-query","options":{"versions":{"wilycode/database-query":"0.2.0"}}}'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: composer test
